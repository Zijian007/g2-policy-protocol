[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "g2-policy-protocol"
version = "0.7.0"  # 固定不变：两端以 git pull 同步，不靠包版本区分
description = "Model-neutral G2 communication contracts and robot data semantics"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "msgpack>=1.0", "scipy>=1.11", "websockets>=12", "Pillow>=9.1"]

[project.scripts]
g2-policy-check = "g2_policy_protocol.diagnostics:main"

[project.optional-dependencies]
dev = ["pytest>=7", "ruff==0.17.3"]

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
required-version = "==0.17.3"
target-version = "py310"
line-length = 100
extend-exclude = ["third_party", "build", "dist", "wheelhouse", "artifacts"]
force-exclude = true

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP006", "UP007", "UP035", "UP045"]
