[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "g2-policy-protocol"
version = "0.5.0"
description = "Model-neutral G2 policy contracts and shared robot tools"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "msgpack>=1.0"]

[project.optional-dependencies]
geometry = ["scipy>=1.11"]
tools = ["websockets>=12", "Pillow>=9"]

[project.scripts]
g2-policy-check = "g2_policy_protocol.check_server:main"
g2-policy-sample = "g2_policy_protocol.samples:main"

[dependency-groups]
dev = ["pytest>=7", "jsonschema>=4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.setuptools.package-data]
g2_policy_protocol = ["g2.schema.json", "g2.v3.schema.json"]
