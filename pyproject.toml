[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "g2-policy-protocol"
version = "0.6.0"
description = "Model-neutral G2 communication contracts and robot data semantics"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "msgpack>=1.0", "scipy>=1.11", "websockets>=12", "Pillow>=9.1"]

[project.scripts]
g2-policy-check = "g2_policy_protocol.check_server:main"

[dependency-groups]
dev = ["pytest>=7", "jsonschema>=4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.setuptools.package-data]
g2_policy_protocol = ["g2.schema.json"]
